name: Run HorseBot

on:
  workflow_dispatch: # اجازه اجرای دستی از تب Actions
  # schedule:
  #   - cron: '0 */5 * * *' # اختیاری: اجرای خودکار هر ۵ ساعت (چون محدودیت گیت‌هاب ۶ ساعت است)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # جلوگیری از خطای تایم‌اوت ۶ ساعته گیت‌هاب

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot playwright httpx

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          USER_DEVICE_ID: ${{ secrets.USER_DEVICE_ID }}
          USER_UDI: ${{ secrets.USER_UDI }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # متغیر GITHUB_REPOSITORY به صورت خودکار توسط گیت‌هاب ست می‌شود
        run: python bot.py
